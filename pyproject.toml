# ---------------------------------------------------------------------------
# Template pyproject.toml — copy into a new project folder, then:
#   1. Update `name` and `description` below
#   2. Run `uv sync` to create .venv and install everything listed here
#   3. Add/remove packages as needed with `uv add <pkg>` / `uv remove <pkg>`
# ---------------------------------------------------------------------------

[project]
name = "change-me"                     # e.g. "extract-drainage-system"
version = "0.1.0"
description = "Change me: one-line description of what this project does"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.0",
    "pandas>=2.2",
    "fiona>=1.10.1",
    "shapely>=2.0",
    "numpy>=2.0",
    "pyproj>=3.6",
]

# Notes:
# - tkinter is part of the Python standard library — do NOT add it here.
#   Just make sure the Python build you're using includes it (standard on
#   macOS python.org / Homebrew builds).
# - GDAL itself must still be installed at the system level for fiona/
#   geopandas to work: `brew install gdal`.
# - Add project-specific extras as needed, e.g.:
#     "tqdm>=4.66",       # progress bars for batch delineation
#     "pyogrio>=0.9",     # faster I/O backend, alternative to fiona

[tool.uv]
# This is a scripts project (Module/), not an installable library —
# skip building/installing it as a package. Without this, `uv sync`/
# `uv add` fail with a hatchling "no file selection defined" error,
# since there's no actual package for it to build a wheel from.
package = false
